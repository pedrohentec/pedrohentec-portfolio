    start: 2025-01-06
    summary: |
      Atuo no desenvolvimento e monitoramento de pipelines de dados em ambiente GCP, com foco em performance, governança e confiabilidade das informações.
      Utilizo Apache Beam e Dataflow para orquestração de dados no BigQuery, aplicando boas práticas de modularização e processamento assíncrono.

      ● Criação de pipelines com Apache Beam (Python) no Dataflow, processando dados em batch e streaming.

      ● Validação automática de tabelas e partições no BigQuery, com geração de modelos dinâmicos a partir de arquivos JSON.

      ● Monitoramento de jobs via API (Dataflow e BigQuery), com foco em status, métricas e integridade dos dados.

      ● Governança e classificação de dados com Dataplex, alinhada à LGPD.

      ● Otimização e refatoração de pipelines legados para maior eficiência e reusabilidade.

  - role: Engenheiro de Dados
    org: A3Data
    start: 2024-07-01
    end: 2025-03-01
    summary: |
      Atuei como Engenheiro de Dados em projetos em ambiente AWS, com foco na construção e otimização de pipelines de dados em larga escala.

      ● Desenvolvimento de pipelines com Spark, SQL e Python em ambiente AWS EMR, orquestrados pelo Airflow.

      ● Otimização de queries e fluxos de dados com Athena, com dados armazenados no S3.

      ● Uso de Docker e Kubernetes (EKS) para empacotamento e deploy de aplicações de dados.

      ● Suporte na implementação de boas práticas de versionamento com Git/GitHub.

      ● Participação ativa na análise de requisitos de dados, contribuindo com insights técnicos para decisões estratégicas.

